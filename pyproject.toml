[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-accounts"
version = "0.1.0a1"
description = "Modern, zero-boilerplate authentication and account management for FastAPI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "FastAPI Accounts Contributors" }
]
keywords = ["fastapi", "authentication", "oauth2", "account-management", "jwt", "passkeys", "sessions"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "pwdlib[argon2]>=0.2.0",
    "cryptography>=42.0.0",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_accounts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
[project.urls]
Homepage = "https://github.com/fastapi-accounts/fastapi-accounts"
Documentation = "https://github.com/fastapi-accounts/fastapi-accounts"
Repository = "https://github.com/fastapi-accounts/fastapi-accounts.git"
Discussions = "https://github.com/fastapi-accounts/fastapi-accounts/discussions"
