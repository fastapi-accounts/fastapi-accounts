[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-accounts"
version = "0.1.0a0"
description = "Modern, zero-boilerplate authentication and account management for FastAPI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "FastAPI Accounts Contributors" }
]
keywords = ["fastapi", "authentication", "oauth2", "account-management", "jwt", "passkeys", "sessions"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fastapi-accounts/fastapi-accounts"
Documentation = "https://github.com/fastapi-accounts/fastapi-accounts"
Repository = "https://github.com/fastapi-accounts/fastapi-accounts.git"
Discussions = "https://github.com/fastapi-accounts/fastapi-accounts/discussions"