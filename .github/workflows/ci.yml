name: CI

on:
  push:
    branches: ["main", "fix/*", "feat/*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_fastapi_accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,sqlite,migrations]"

      - name: Run Ruff Lint & Format Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          mypy src tests

      - name: Run Test Suite (SQLite & PostgreSQL Integration)
        env:
          TEST_POSTGRES_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/test_fastapi_accounts"
        run: |
          pytest -v

      - name: Build Wheel and Source Distribution
        run: |
          rm -rf dist build *.egg-info
          python -m build
          twine check dist/*

      - name: Isolated Wheel Smoke Test & Migration Execution
        run: |
          python -m venv test_venv
          ./test_venv/bin/pip install --upgrade pip
          WHEELS=(dist/*.whl)
          if [ ${#WHEELS[@]} -ne 1 ]; then echo "Expected exactly 1 wheel, found ${#WHEELS[@]}"; exit 1; fi
          WHEEL_PATH="${WHEELS[0]}"
          
          # 1. Test core-only installation
          ./test_venv/bin/pip install "$WHEEL_PATH"
          ./test_venv/bin/python -c "import fastapi_accounts; print('Core import OK:', fastapi_accounts.__version__)"
          
          # 2. Test extras installation, fresh migration, and legacy adoption in clean working directory
          ./test_venv/bin/pip install "${WHEEL_PATH}[sqlite,postgres,migrations]"
          TMP_TEST_DIR=$(mktemp -d)
          cd "$TMP_TEST_DIR"
          "$GITHUB_WORKSPACE/test_venv/bin/python" -c "
          import uuid
          from datetime import datetime, timezone
          import sqlalchemy as sa
          from sqlalchemy import create_engine
          from alembic import command
          from fastapi_accounts.migrations import get_alembic_config, SchemaState, inspect_legacy_schema

          # A. Fresh database upgrade & check
          cfg = get_alembic_config('sqlite:///./fresh_wheel_test.db')
          command.upgrade(cfg, 'head')
          command.check(cfg)
          print('Fresh upgrade & check OK')

          # B. Legacy adoption test on unmanaged schema
          engine = create_engine('sqlite:///./legacy_a3_wheel_test.db')
          meta = sa.MetaData()
          sa.Table('users', meta, sa.Column('id', sa.Uuid(), primary_key=True), sa.Column('is_active', sa.Boolean(), nullable=False), sa.Column('is_superuser', sa.Boolean(), nullable=False), sa.Column('created_at', sa.DateTime(timezone=True), nullable=False), sa.Column('updated_at', sa.DateTime(timezone=True), nullable=False))
          sa.Table('email_addresses', meta, sa.Column('id', sa.Uuid(), primary_key=True), sa.Column('user_id', sa.Uuid(), sa.ForeignKey('users.id', ondelete='CASCADE'), nullable=False, index=True), sa.Column('email', sa.String(320), nullable=False, unique=True, index=True), sa.Column('is_verified', sa.Boolean(), nullable=False), sa.Column('is_primary', sa.Boolean(), nullable=False), sa.Column('created_at', sa.DateTime(timezone=True), nullable=False))
          sa.Table('password_credentials', meta, sa.Column('id', sa.Uuid(), primary_key=True), sa.Column('user_id', sa.Uuid(), sa.ForeignKey('users.id', ondelete='CASCADE'), nullable=False, unique=True, index=True), sa.Column('hashed_password', sa.String(1024), nullable=False), sa.Column('password_updated_at', sa.DateTime(timezone=True), nullable=False), sa.Column('created_at', sa.DateTime(timezone=True), nullable=False), sa.Column('updated_at', sa.DateTime(timezone=True), nullable=False))
          sa.Table('sessions', meta, sa.Column('id', sa.String(64), primary_key=True), sa.Column('user_id', sa.Uuid(), sa.ForeignKey('users.id', ondelete='CASCADE'), nullable=False, index=True), sa.Column('created_at', sa.DateTime(timezone=True), nullable=False), sa.Column('expires_at', sa.DateTime(timezone=True), nullable=False, index=True), sa.Column('ip_address', sa.String(45), nullable=True), sa.Column('user_agent', sa.String(512), nullable=True))
          meta.create_all(engine)

          with engine.connect() as conn:
              res = inspect_legacy_schema(conn)
              assert res.state == SchemaState.UNVERSIONED_A3
              assert res.stamp_revision == '0003_add_session_indexes'

          cfg_legacy = get_alembic_config('sqlite:///./legacy_a3_wheel_test.db')
          command.stamp(cfg_legacy, res.stamp_revision)
          command.upgrade(cfg_legacy, 'head')
          command.check(cfg_legacy)
          print('Legacy adoption upgrade & check OK')
          "
          rm -rf "$TMP_TEST_DIR"

